<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة حفل عيد العرش المجيد - بنغازي</title>
    <!-- Bootstrap RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- SheetJS Library for Excel parsing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-box { background: linear-gradient(135deg, #134e4a, #065f46); color: white; border-radius: 12px; }
        .seat-badge { font-size: 1.1rem; padding: 6px 12px; }
        .status-occupied { background-color: #dc3545; color: white; }
        .status-empty { background-color: #198754; color: white; }
    </style>
</head>
<body>

<div class="container py-4">
    <!-- Header -->
    <div class="header-box p-4 mb-4 text-center shadow">
        <h2>القنصلية العامة للمملكة المغربية ببنغازي</h2>
        <h4>منظومة الاستعلام عن مقاعد حفل ذكرى عيد العرش المجيد الـ 27</h4>
        <p class="mb-0 text-light small">إشراف المهندس: جهاد</p>
    </div>

    <!-- Search Section -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="searchInput" class="form-label fw-bold">🔍 بحث باسم الضيف:</label>
                    <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="اكتب اسم الضيف هنا..." oninput="searchData()">
                </div>
                <div class="col-md-6">
                    <label for="seatInput" class="form-label fw-bold">🪑 بحث برقم المقعد (الكرسي):</label>
                    <input type="number" id="seatInput" class="form-control form-control-lg" placeholder="أدخل رقم الكرسي..." oninput="checkSeat()">
                </div>
            </div>
        </div>
    </div>

    <!-- Seat Status Result (When searching by seat number) -->
    <div id="seatStatusResult" class="mb-4" style="display: none;"></div>

    <!-- Search Results Table -->
    <div class="card shadow-sm">
        <div class="card-header bg-white fw-bold">📋 نتائج البحث والضيوف</div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover table-striped align-middle mb-0" id="guestsTable">
                    <thead class="table-dark">
                        <tr>
                            <th>رقم الجلوس</th>
                            <th>الصف / القطاع</th>
                            <th>اسم الضيف</th>
                            <th>الصفة / الصفة الرسمية</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr>
                            <td colspan="4" class="text-center py-4">جاري تحميل بيانات الشيت...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    let guestsData = [];
    let seatMap = {};

    // Load Excel file automatically on page load
    window.addEventListener('DOMContentLoaded', () => {
        fetch('جدول الحضور-1.xlsx')
            .then(res => res.arrayBuffer())
            .then(buffer => {
                const workbook = XLSX.read(buffer, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const sheet = workbook.Sheets[sheetName];
                const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                
                processData(jsonData);
            })
            .catch(err => {
                console.error(err);
                document.getElementById('tableBody').innerHTML = `<tr><td colspan="4" class="text-center text-danger">حدث خطأ في تحميل ملف Excel. التأكد من وجود الملف باسم 'جدول الحضور-1.xlsx' في نفس المستودع.</td></tr>`;
            });
    });

    function processData(rows) {
        guestsData = [];
        seatMap = {};
        let currentSection = "الصف الأول";

        for (let i = 0; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length === 0) continue;

            const col2 = row[2] ? String(row[2]).trim() : '';
            const col3 = row[3] ? String(row[3]).trim() : '';
            const col4 = row[4] ? String(row[4]).trim() : '';

            // Identify section headers (e.g., الصف الثاني, الصف الثالث)
            if (col2.includes('الصف') && !col3 && !col4) {
                currentSection = col2;
                continue;
            }

            if (col4 && !isNaN(col4) && col3 && col3 !== 'الاسم') {
                const seatNum = parseInt(col4);
                const guest = {
                    seat: seatNum,
                    section: currentSection,
                    name: col3,
                    title: col2
                };
                guestsData.push(guest);
                seatMap[seatNum] = guest;
            }
        }

        renderTable(guestsData);
    }

    function renderTable(data) {
        const tbody = document.getElementById('tableBody');
        if (data.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="text-center py-3">لا توجد نتائج مطابقة</td></tr>`;
            return;
        }

        tbody.innerHTML = data.map(item => `
            <tr>
                <td><span class="badge bg-primary seat-badge">${item.seat}</span></td>
                <td><span class="badge bg-secondary">${item.section}</span></td>
                <td class="fw-bold">${item.name}</td>
                <td class="text-muted">${item.title || '-'}</td>
            </tr>
        `).join('');
    }

    function searchData() {
        document.getElementById('seatInput').value = '';
        document.getElementById('seatStatusResult').style.display = 'none';

        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        if (!query) {
            renderTable(guestsData);
            return;
        }

        const filtered = guestsData.filter(g => 
            g.name.toLowerCase().includes(query) || 
            (g.title && g.title.toLowerCase().includes(query))
        );
        renderTable(filtered);
    }

    function checkSeat() {
        document.getElementById('searchInput').value = '';
        const seatNum = parseInt(document.getElementById('seatInput').value);
        const resultDiv = document.getElementById('seatStatusResult');

        if (isNaN(seatNum)) {
            resultDiv.style.display = 'none';
            renderTable(guestsData);
            return;
        }

        if (seatMap[seatNum]) {
            const guest = seatMap[seatNum];
            resultDiv.className = "alert alert-danger shadow-sm";
            resultDiv.innerHTML = `
                <h5>🚨 الكرسي رقم (${seatNum}) : <span class="badge bg-danger">مشغول / محجوز</span></h5>
                <hr>
                <p class="mb-1"><strong>الاسم:</strong> ${guest.name}</p>
                <p class="mb-1"><strong>الصفة:</strong> ${guest.title}</p>
                <p class="mb-0"><strong>الموقع:</strong> ${guest.section}</p>
            `;
            renderTable([guest]);
        } else {
            resultDiv.className = "alert alert-success shadow-sm";
            resultDiv.innerHTML = `
                <h5>✅ الكرسي رقم (${seatNum}) : <span class="badge bg-success">شاغر (فاضي)</span></h5>
                <p class="mb-0">لا يوجد ضيف مسجل على هذا المقعد.</p>
            `;
            renderTable([]);
        }
        resultDiv.style.display = 'block';
    }
</script>

</body>
</html>
