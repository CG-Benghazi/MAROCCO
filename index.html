<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منظومة حفل عيد العرش المجيد - بنغازي</title>
    <!-- Bootstrap RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Amiri:wght@700&display=swap" rel="stylesheet">
    <!-- SheetJS Library -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --morocco-red: #d61837;
            --morocco-red-bright: #e62445;
            --morocco-green: #006233;
            --morocco-gold: #d4af37;
            --morocco-gold-light: #fbe8a6;
            --bg-light: #f8fafc;
        }

        body { 
            background-color: var(--bg-light); 
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 40px;
        }

        /* خلفية حمراء زاهية بنقش مغربي هندسي ناصع */
        .royal-header {
            background: linear-gradient(135deg, #e6193c 0%, #c80d2e 50%, #d61837 100%);
            color: #ffffff;
            border-radius: 0 0 28px 28px;
            padding: 24px 16px 22px 16px;
            box-shadow: 0 8px 25px rgba(214, 24, 55, 0.25);
            position: relative;
            overflow: hidden;
            border-bottom: 4px solid var(--morocco-gold);
        }

        .royal-header::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 232, 166, 0.25) 2px, transparent 2.5px),
                radial-gradient(circle at 0 0, rgba(255, 232, 166, 0.15) 2px, transparent 2.5px);
            background-size: 24px 24px, 12px 12px;
            opacity: 0.8;
            pointer-events: none;
        }

        .coat-of-arms {
            width: 75px;
            height: auto;
            max-height: 85px;
            filter: drop-shadow(0px 3px 6px rgba(0, 0, 0, 0.25));
            position: relative;
            z-index: 2;
        }

        /* تصميم وسام شعار عيد العرش 27 الفاخر */
        .throne-badge {
            background: linear-gradient(135deg, #fff9e6 0%, #fbe8a6 100%);
            border: 2px solid var(--morocco-gold);
            border-radius: 50px;
            padding: 6px 18px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2), inset 0 0 8px rgba(212, 175, 55, 0.4);
            position: relative;
            z-index: 2;
            margin-bottom: 12px;
            transform: scale(1.02);
        }

        .throne-badge .throne-text {
            color: #8b0000;
            font-family: 'Amiri', serif;
            font-weight: 700;
            font-size: 1.15rem;
            line-height: 1.1;
            text-shadow: 0 1px 1px rgba(255,255,255,0.8);
        }

        .throne-badge .throne-num {
            background: var(--morocco-red);
            color: #ffffff;
            font-weight: 900;
            font-size: 1.1rem;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--morocco-gold);
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 800;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
            position: relative;
            z-index: 2;
        }

        .header-subtitle {
            font-size: 0.9rem;
            color: var(--morocco-gold-light);
            font-weight: 700;
            position: relative;
            z-index: 2;
        }

        .engineer-badge {
            background: rgba(255, 255, 255, 0.18);
            backdrop-filter: blur(4px);
            border: 1px solid var(--morocco-gold-light);
            padding: 5px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            position: relative;
            z-index: 2;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .search-card {
            border: none;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            margin-top: -15px;
            position: relative;
            z-index: 3;
        }

        .form-control-lg, .form-select {
            font-size: 0.95rem;
            border-radius: 12px;
        }

        .guest-card {
            background: #ffffff;
            border-radius: 14px;
            border: 1px solid #edf2f7;
            padding: 12px 14px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .seat-number-box {
            background: linear-gradient(135deg, var(--morocco-red) 0%, #a80a24 100%);
            color: white;
            min-width: 50px;
            height: 50px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 8px rgba(214, 24, 55, 0.3);
        }

        .seat-number-box .num {
            font-size: 1.25rem;
            font-weight: 800;
            line-height: 1;
        }

        .seat-number-box .lbl {
            font-size: 0.6rem;
            opacity: 0.85;
        }

        .section-tag {
            background-color: #e6f4ed;
            color: var(--morocco-green);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
        }

        .guest-name {
            font-size: 1rem;
            font-weight: 700;
            color: #1e293b;
        }

        .guest-title {
            font-size: 0.8rem;
            color: #64748b;
        }

        .status-box {
            border-radius: 16px;
            padding: 16px;
        }

        .action-btn {
            border-radius: 10px;
            padding: 4px 10px;
            font-size: 0.8rem;
        }

        .admin-only {
            display: none !important;
        }

        .is-admin .admin-only {
            display: inline-block !important;
        }

        .is-admin .admin-flex {
            display: flex !important;
        }
    </style>
</head>
<body id="bodyTag">

<!-- Moroccan Royal Header -->
<div class="royal-header text-center">
    <!-- شعار المملكة المغربية -->
    <div class="mb-2">
        <img src="https://raw.githubusercontent.com/twitter/twemoji/master/assets/72x72/1f1f2-1f1e6.png" 
             onerror="this.onerror=null; this.src='https://upload.wikimedia.org/wikipedia/commons/d/d1/Coat_of_arms_of_Morocco.svg';"
             alt="شعار المملكة المغربية" 
             class="coat-of-arms">
    </div>

    <!-- وسام شعار عيد العرش 27 الخيالي -->
    <div>
        <div class="throne-badge">
            <i class="fa-solid fa-crown text-warning fs-5"></i>
            <span class="throne-text">ذكرى عيد العرش المجيد</span>
            <span class="throne-num">27</span>
        </div>
    </div>

    <div class="header-title">القنصلية العامة للمملكة المغربية ببنغازي</div>
    <div class="header-subtitle mt-1 mb-2">منظومة الاستعلام والإدارة لحفل الاستقبال الرسمي</div>
    <div>
        <span class="engineer-badge">
            <i class="fa-solid fa-user-gear text-warning"></i>
            <span>إشراف المهندس: <strong>جهاد ال وردي</strong></span>
        </span>
    </div>
</div>

<div class="container px-3">
    <!-- Top Admin & Actions Bar -->
    <div class="d-flex gap-2 justify-content-between align-items-center my-3">
        <div>
            <!-- Admin Login Button -->
            <button id="loginBtn" class="btn btn-outline-danger btn-sm rounded-pill px-3 shadow-sm bg-white" data-bs-toggle="modal" data-bs-target="#loginModal">
                <i class="fa-solid fa-lock me-1"></i> دخول المسؤول
            </button>
            <!-- Admin Logout Button -->
            <button id="logoutBtn" class="btn btn-dark btn-sm rounded-pill px-3 shadow-sm admin-only" onclick="logoutAdmin()">
                <i class="fa-solid fa-right-from-bracket text-warning me-1"></i> خروج المسؤول
            </button>
        </div>

        <div class="d-flex gap-2">
            <!-- Add Seat Button (Admin Only) -->
            <button class="btn btn-danger btn-sm rounded-pill px-3 shadow-sm admin-only" data-bs-toggle="modal" data-bs-target="#editModal" onclick="prepareAddModal()">
                <i class="fa-solid fa-plus text-warning me-1"></i> إضافة مقعد
            </button>
            <!-- Export Excel Button -->
            <button class="btn btn-outline-success btn-sm rounded-pill px-3 shadow-sm bg-white" onclick="exportToExcel()">
                <i class="fa-solid fa-file-excel text-success me-1"></i> تصدير Excel
            </button>
        </div>
    </div>

    <!-- Search Inputs Card -->
    <div class="card search-card p-3 mb-3">
        <!-- Search by Name -->
        <div class="mb-3">
            <label for="searchInput" class="form-label fw-bold small text-secondary">🔍 بحث باسم الضيف:</label>
            <div class="input-group">
                <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="اكتب اسم الضيف..." oninput="searchData()">
                <button class="btn btn-outline-secondary px-3" type="button" onclick="clearSearch('searchInput')"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>

        <!-- Search by Seat -->
        <div>
            <label for="seatInput" class="form-label fw-bold small text-secondary">🪑 فحص رقم الكرسي (شاغر / مشغول):</label>
            <div class="input-group">
                <input type="number" id="seatInput" class="form-control form-control-lg" placeholder="أدخل رقم الكرسي..." oninput="checkSeat()">
                <button class="btn btn-outline-secondary px-3" type="button" onclick="clearSearch('seatInput')"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
    </div>

    <!-- Seat Status Result -->
    <div id="seatStatusResult" class="mb-3" style="display: none;"></div>

    <!-- Results Count Bar -->
    <div class="d-flex align-items-center justify-content-between mb-2 px-1">
        <span class="fw-bold text-dark small"><i class="fa-solid fa-users me-1 text-danger"></i> قائمة الحضور المسجلة</span>
        <span class="badge bg-dark rounded-pill px-3 py-2" id="totalCount">0 ضيف</span>
    </div>

    <!-- Guests Cards Container -->
    <div id="cardsContainer">
        <div class="text-center py-5">
            <div class="spinner-border text-danger mb-2" role="status"></div>
            <p class="text-muted small">جاري تحميل جدول الحضور...</p>
        </div>
    </div>
</div>

<!-- Modal: Login Admin -->
<div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header bg-dark text-white border-0 rounded-top-4">
                <h6 class="modal-title fw-bold"><i class="fa-solid fa-user-shield text-warning me-2"></i>تسجيل دخول المسؤول</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form onsubmit="loginAdmin(event)">
                    <div class="mb-3">
                        <label class="form-label fw-bold small">اسم المستخدم (Username)</label>
                        <input type="text" id="adminUser" class="form-control" required placeholder="أدخل اسم المستخدم">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small">كلمة السر (Password)</label>
                        <input type="password" id="adminPass" class="form-control" required placeholder="أدخل كلمة السر">
                    </div>
                    <div id="loginError" class="text-danger small mb-3" style="display: none;">اسم المستخدم أو كلمة السر غير صحيحة!</div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger fw-bold rounded-3 py-2">تسجيل الدخول</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Add / Edit Seat -->
<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg rounded-4">
            <div class="modal-header bg-danger text-white border-0 rounded-top-4">
                <h6 class="modal-title fw-bold" id="modalTitle"><i class="fa-solid fa-pen-to-square me-2"></i>إضافة / تعديل مقعد</h6>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="seatForm" onsubmit="saveSeat(event)">
                    <div class="mb-3">
                        <label class="form-label fw-bold small">رقم الكرسي *</label>
                        <input type="number" id="modalSeatNum" class="form-control" required placeholder="مثلاً: 12">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small">الصف / الموقع *</label>
                        <select id="modalSection" class="form-select" required>
                            <option value="الصف الأول">الصف الأول</option>
                            <option value="الصف الثاني">الصف الثاني</option>
                            <option value="الصف الثالث">الصف الثالث</option>
                            <option value="الصف الرابع">الصف الرابع</option>
                            <option value="الصف الخامس">الصف الخامس</option>
                            <option value="الصف السادس">الصف السادس</option>
                            <option value="الصف السابع">الصف السابع</option>
                            <option value="الصف الثامن">الصف الثامن</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small">اسم الضيف *</label>
                        <input type="text" id="modalName" class="form-control" required placeholder="الاسم الكامل للضيف">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small">الصفة الرسمية</label>
                        <input type="text" id="modalTitleRole" class="form-control" placeholder="الصفة الوظيفية أو المكانة">
                    </div>
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-danger fw-bold rounded-3 py-2">حفظ التغييرات</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Config Login Credentials
    const ADMIN_USER = "jihad";
    const ADMIN_PASS = "morocco2026";

    let guestsData = [];
    let seatMap = {};
    let bsEditModal, bsLoginModal;
    let isAdminLoggedIn = false;

    window.addEventListener('DOMContentLoaded', () => {
        bsEditModal = new bootstrap.Modal(document.getElementById('editModal'));
        bsLoginModal = new bootstrap.Modal(document.getElementById('loginModal'));

        // Check stored login state
        if (sessionStorage.getItem('isAdmin') === 'true') {
            enableAdminMode();
        }

        loadExcel('جدول الحضور-1.xlsx')
            .catch(() => loadExcel('جدول الحضور.xlsx'))
            .catch(err => {
                console.error(err);
                document.getElementById('cardsContainer').innerHTML = `
                    <div class="card p-4 text-center border-danger">
                        <i class="fa-solid fa-triangle-exclamation text-danger fs-1 mb-2"></i>
                        <h6 class="fw-bold text-danger">تعذر تحميل جدول البيانات</h6>
                        <p class="text-muted small mb-0">تأكد من وجود ملف <strong>'جدول الحضور.xlsx'</strong> داخل المستودع.</p>
                    </div>`;
            });
    });

    function loginAdmin(e) {
        e.preventDefault();
        const user = document.getElementById('adminUser').value.trim();
        const pass = document.getElementById('adminPass').value.trim();

        if (user === ADMIN_USER && pass === ADMIN_PASS) {
            sessionStorage.setItem('isAdmin', 'true');
            enableAdminMode();
            bsLoginModal.hide();
            document.getElementById('loginError').style.display = 'none';
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    }

    function enableAdminMode() {
        isAdminLoggedIn = true;
        document.getElementById('bodyTag').classList.add('is-admin');
        document.getElementById('loginBtn').style.display = 'none';
        document.getElementById('logoutBtn').style.display = 'inline-block';
        renderCards(guestsData);
        if (document.getElementById('seatInput').value) checkSeat();
    }

    function logoutAdmin() {
        isAdminLoggedIn = false;
        sessionStorage.removeItem('isAdmin');
        document.getElementById('bodyTag').classList.remove('is-admin');
        document.getElementById('loginBtn').style.display = 'inline-block';
        document.getElementById('logoutBtn').style.display = 'none';
        renderCards(guestsData);
        if (document.getElementById('seatInput').value) checkSeat();
    }

    function loadExcel(filename) {
        return fetch(filename)
            .then(res => {
                if (!res.ok) throw new Error('File not found: ' + filename);
                return res.arrayBuffer();
            })
            .then(buffer => {
                const workbook = XLSX.read(buffer, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const sheet = workbook.Sheets[sheetName];
                const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                processData(jsonData);
            });
    }

    function processData(rows) {
        guestsData = [];
        seatMap = {};
        let currentSection = "الصف الأول";

        for (let i = 0; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length === 0) continue;

            const col2 = row[2] ? String(row[2]).trim() : '';
            const col3 = row[3] ? String(row[3]).trim() : '';
            const col4 = row[4] ? String(row[4]).trim() : '';

            if (col2.includes('الصف') && !col3 && !col4) {
                currentSection = col2;
                continue;
            }

            if (col4 && !isNaN(col4) && col3 && col3 !== 'الاسم') {
                const seatNum = parseInt(col4);
                const guest = {
                    seat: seatNum,
                    section: currentSection,
                    name: col3,
                    title: col2
                };
                guestsData.push(guest);
                seatMap[seatNum] = guest;
            }
        }

        updateUI();
    }

    function updateUI() {
        seatMap = {};
        guestsData.forEach(g => seatMap[g.seat] = g);
        guestsData.sort((a, b) => a.seat - b.seat);
        document.getElementById('totalCount').innerText = `${guestsData.length} ضيف`;
        renderCards(guestsData);
    }

    function renderCards(data) {
        const container = document.getElementById('cardsContainer');
        if (data.length === 0) {
            container.innerHTML = `
                <div class="card p-4 text-center text-muted my-3">
                    <i class="fa-solid fa-magnifying-glass fs-2 mb-2 text-secondary"></i>
                    <span>لا توجد نتائج مطابقة</span>
                </div>`;
            return;
        }

        container.innerHTML = data.map(item => `
            <div class="guest-card d-flex align-items-center gap-3">
                <div class="seat-number-box">
                    <span class="num">${item.seat}</span>
                    <span class="lbl">كرسي</span>
                </div>
                <div class="flex-grow-1 overflow-hidden">
                    <div class="d-flex align-items-center justify-content-between mb-1">
                        <span class="section-tag">${item.section}</span>
                        <div class="admin-only">
                            <button class="btn btn-light text-primary action-btn p-1 px-2" onclick="editSeatModal(${item.seat})"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn btn-light text-danger action-btn p-1 px-2" onclick="deleteSeat(${item.seat})"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                    <div class="guest-name text-truncate">${item.name}</div>
                    <div class="guest-title text-truncate">${item.title || 'ضيف كريم'}</div>
                </div>
            </div>
        `).join('');
    }

    function searchData() {
        document.getElementById('seatInput').value = '';
        document.getElementById('seatStatusResult').style.display = 'none';

        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        if (!query) {
            renderCards(guestsData);
            return;
        }

        const filtered = guestsData.filter(g => 
            g.name.toLowerCase().includes(query) || 
            (g.title && g.title.toLowerCase().includes(query))
        );
        renderCards(filtered);
    }

    function checkSeat() {
        document.getElementById('searchInput').value = '';
        const seatNum = parseInt(document.getElementById('seatInput').value);
        const resultDiv = document.getElementById('seatStatusResult');

        if (isNaN(seatNum)) {
            resultDiv.style.display = 'none';
            renderCards(guestsData);
            return;
        }

        if (seatMap[seatNum]) {
            const guest = seatMap[seatNum];
            resultDiv.className = "status-box bg-danger text-white shadow-sm";
            resultDiv.innerHTML = `
                <div class="d-flex align-items-center justify-content-between mb-2">
                    <div class="d-flex align-items-center gap-2">
                        <i class="fa-solid fa-circle-xmark fs-3 text-warning"></i>
                        <h6 class="mb-0 fw-bold">الكرسي رقم (${seatNum}) : <span class="badge bg-warning text-dark">مشغــــول</span></h6>
                    </div>
                    ${isAdminLoggedIn ? `<button class="btn btn-light btn-sm text-dark fw-bold rounded-pill" onclick="editSeatModal(${seatNum})">تعديل المقعد</button>` : ''}
                </div>
                <div class="bg-black bg-opacity-25 p-2 rounded-3 small">
                    <div><strong>الاسم:</strong> ${guest.name}</div>
                    <div><strong>الصفة:</strong> ${guest.title || '-'}</div>
                    <div><strong>الموقع:</strong> ${guest.section}</div>
                </div>
            `;
            renderCards([guest]);
        } else {
            resultDiv.className = "status-box bg-success text-white shadow-sm";
            resultDiv.innerHTML = `
                <div class="d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center gap-2">
                        <i class="fa-solid fa-circle-check fs-3"></i>
                        <div>
                            <h6 class="mb-0 fw-bold">الكرسي رقم (${seatNum}) : شــــاغر (فاضي)</h6>
                            <span class="small opacity-75">المقعد متاح للضيوف.</span>
                        </div>
                    </div>
                    ${isAdminLoggedIn ? `<button class="btn btn-light btn-sm text-success fw-bold rounded-pill ms-2" onclick="prepareAddModal(${seatNum})">حجز المقعد</button>` : ''}
                </div>
            `;
            renderCards([]);
        }
        resultDiv.style.display = 'block';
    }

    function prepareAddModal(presetSeatNum = '') {
        if (!isAdminLoggedIn) return;
        document.getElementById('modalTitle').innerText = presetSeatNum ? `حجز المقعد رقم (${presetSeatNum})` : 'إضافة مقعد جديد';
        document.getElementById('modalSeatNum').value = presetSeatNum;
        document.getElementById('modalSeatNum').readOnly = false;
        document.getElementById('modalName').value = '';
        document.getElementById('modalTitleRole').value = '';
        bsEditModal.show();
    }

    function editSeatModal(seatNum) {
        if (!isAdminLoggedIn) return;
        const guest = seatMap[seatNum];
        if (!guest) return;

        document.getElementById('modalTitle').innerText = `تعديل بيانات المقعد رقم (${seatNum})`;
        document.getElementById('modalSeatNum').value = guest.seat;
        document.getElementById('modalSeatNum').readOnly = true;
        document.getElementById('modalSection').value = guest.section || 'الصف الأول';
        document.getElementById('modalName').value = guest.name;
        document.getElementById('modalTitleRole').value = guest.title || '';
        bsEditModal.show();
    }

    function saveSeat(event) {
        event.preventDefault();
        const seatNum = parseInt(document.getElementById('modalSeatNum').value);
        const section = document.getElementById('modalSection').value;
        const name = document.getElementById('modalName').value.trim();
        const title = document.getElementById('modalTitleRole').value.trim();

        if (seatMap[seatNum]) {
            seatMap[seatNum].section = section;
            seatMap[seatNum].name = name;
            seatMap[seatNum].title = title;
        } else {
            const newGuest = { seat: seatNum, section, name, title };
            guestsData.push(newGuest);
        }

        updateUI();
        bsEditModal.hide();
        if (document.getElementById('seatInput').value) checkSeat();
    }

    function deleteSeat(seatNum) {
        if (!isAdminLoggedIn) return;
        if (confirm(`هل أنت تأكد من إخلاء الكرسي رقم (${seatNum}) وتحويله لشاغر؟`)) {
            guestsData = guestsData.filter(g => g.seat !== seatNum);
            updateUI();
            if (document.getElementById('seatInput').value) checkSeat();
        }
    }

    function clearSearch(inputId) {
        document.getElementById(inputId).value = '';
        if (inputId === 'searchInput') searchData();
        if (inputId === 'seatInput') checkSeat();
    }

    function exportToExcel() {
        const exportArr = [["الصفه", "الاسم", "أرقام الجلوس"]];
        guestsData.forEach(g => {
            exportArr.push([g.title, g.name, g.seat]);
        });
        const ws = XLSX.utils.aoa_to_sheet(exportArr);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "جدول الحضور المحدث");
        XLSX.writeFile(wb, "جدول_الحضور_المحدث.xlsx");
    }
</script>

</body>
</html>
