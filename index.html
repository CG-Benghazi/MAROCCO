        function renderGuests(data) {
            const container = document.getElementById('guestsContainer');
            const countBadge = document.getElementById('countBadge');
            container.innerHTML = '';
            countBadge.innerText = data.length;

            if (data.length === 0) {
                container.innerHTML = `
                    <div class="col-12 text-center py-5">
                        <p class="text-muted fs-5">لم يتم العثور على أي نتائج مطابقة</p>
                    </div>`;
                return;
            }

            data.forEach(g => {
                const card = document.createElement('div');
                card.className = 'col-12 col-md-6 col-lg-4';
                card.innerHTML = `
                    <div class="card guest-card p-3 shadow-sm h-100">
                        <div class="d-flex align-items-center justify-content-between mb-2">
                            <span class="seat-badge">مقعد ${g.seat}</span>
                            <span class="row-group-badge">${g.group}</span>
                        </div>
                        <h5 class="fw-bold mb-1 text-primary">${g.name || 'بدون اسم'}</h5>
                        <p class="text-muted mb-0 small">${g.role !== '-' ? g.role : 'لا توجد صفة مدونة'}</p>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // محرك البحث الفوري
        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.trim().toLowerCase();
            if (!query) {
                renderGuests(guests);
                return;
            }

            const filtered = guests.filter(g => 
                g.seat.toString().includes(query) ||
                g.name.toLowerCase().includes(query) ||
                g.role.toLowerCase().includes(query) ||
                g.group.toLowerCase().includes(query)
            );
            renderGuests(filtered);
        });

        // عرض الكل عند الفتح
        renderGuests(guests);
    </script>
