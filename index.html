<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منظومة حفل عيد العرش المجيد - بنغازي</title>
    <!-- Bootstrap RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cairo & Tajawal) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- SheetJS Library for Excel parsing -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --morocco-red: #c8102e;
            --morocco-red-dark: #8b0000;
            --morocco-green: #006233;
            --morocco-gold: #d4af37;
            --morocco-gold-light: #fff4d0;
            --bg-light: #f8fafc;
        }

        body { 
            background-color: var(--bg-light); 
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 30px;
        }

        /* Top Royal Header */
        .royal-header {
            background: linear-gradient(135deg, #a60c25 0%, #c8102e 50%, #7a0619 100%);
            color: #ffffff;
            border-radius: 0 0 24px 24px;
            padding: 24px 16px 20px 16px;
            box-shadow: 0 8px 25px rgba(166, 12, 37, 0.3);
            position: relative;
            overflow: hidden;
            border-bottom: 4px solid var(--morocco-gold);
        }

        /* Moroccan Pattern Overlay */
        .royal-header::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: radial-gradient(var(--morocco-gold) 0.75px, transparent 0.75px);
            background-size: 14px 14px;
            opacity: 0.12;
            pointer-events: none;
        }

        .coat-of-arms {
            width: 85px;
            height: auto;
            filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.4));
            margin-bottom: 8px;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.2px;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .header-subtitle {
            font-size: 0.95rem;
            color: var(--morocco-gold-light);
            font-weight: 600;
        }

        .engineer-badge {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--morocco-gold);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            color: #ffe89a;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(4px);
        }

        /* Search Box Mobile Styling */
        .search-card {
            border: none;
            border-radius: 18px;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            margin-top: -15px;
        }

        .form-control-lg {
            font-size: 1rem;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1.5px solid #e2e8f0;
            background-color: #f8fafc;
        }

        .form-control-lg:focus {
            background-color: #ffffff;
            border-color: var(--morocco-red);
            box-shadow: 0 0 0 4px rgba(200, 16, 46, 0.12);
        }

        .input-group-text {
            border-radius: 12px;
            background-color: #f8fafc;
            border: 1.5px solid #e2e8f0;
        }

        /* Mobile Guest Card */
        .guest-card {
            background: #ffffff;
            border-radius: 14px;
            border: 1px solid #edf2f7;
            padding: 14px 16px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            position: relative;
        }

        .guest-card:active {
            transform: scale(0.98);
            background-color: #fdf2f4;
        }

        .seat-number-box {
            background: linear-gradient(135deg, var(--morocco-red) 0%, var(--morocco-red-dark) 100%);
            color: white;
            min-width: 52px;
            height: 52px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 3px 8px rgba(200, 16, 46, 0.3);
        }

        .seat-number-box .num {
            font-size: 1.3rem;
            font-weight: 800;
            line-height: 1;
        }

        .seat-number-box .lbl {
            font-size: 0.65rem;
            opacity: 0.85;
        }

        .section-tag {
            background-color: #e6f4ed;
            color: var(--morocco-green);
            font-size: 0.75rem;
            font-weight: 700;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid rgba(0, 98, 51, 0.2);
        }

        .guest-name {
            font-size: 1.05rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 2px;
        }

        .guest-title {
            font-size: 0.85rem;
            color: #64748b;
            line-height: 1.3;
        }

        /* Status Result Box */
        .status-box {
            border-radius: 16px;
            padding: 16px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .clear-btn {
            cursor: pointer;
            color: #94a3b8;
        }

        .clear-btn:hover {
            color: var(--morocco-red);
        }
    </style>
</head>
<body>

<!-- Moroccan Royal Header -->
<div class="royal-header text-center">
    <img src="https://upload.wikimedia.org/wikipedia/commons/d/d1/Coat_of_arms_of_Morocco.svg" alt="شعار المملكة المغربية" class="coat-of-arms">
    <div class="header-title">القنصلية العامة للمملكة المغربية ببنغازي</div>
    <div class="header-subtitle mt-1 mb-2">منظومة الاستعلام عن مقاعد حفل عيد العرش الـ 27</div>
    <div>
        <span class="engineer-badge">
            <i class="fa-solid fa-user-gear text-warning"></i>
            <span>إشراف المهندس: <strong>جهاد ال وردي</strong></span>
        </span>
    </div>
</div>

<div class="container px-3">
    <!-- Search Inputs Card -->
    <div class="card search-card p-3 mb-3">
        <!-- Search by Name -->
        <div class="mb-3">
            <label for="searchInput" class="form-label fw-bold small text-secondary">🔍 بحث باسم الضيف:</label>
            <div class="input-group">
                <input type="text" id="searchInput" class="form-control form-control-lg" placeholder="اكتب اسم الضيف هنا..." oninput="searchData()">
                <button class="btn btn-outline-secondary px-3" type="button" onclick="clearSearch('searchInput')"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>

        <!-- Search by Seat -->
        <div>
            <label for="seatInput" class="form-label fw-bold small text-secondary">🪑 فحص رقم الكرسي (شاغر / مشغول):</label>
            <div class="input-group">
                <input type="number" id="seatInput" class="form-control form-control-lg" placeholder="أدخل رقم الكرسي (مثلاً: 5)..." oninput="checkSeat()">
                <button class="btn btn-outline-secondary px-3" type="button" onclick="clearSearch('seatInput')"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
    </div>

    <!-- Seat Status Result -->
    <div id="seatStatusResult" class="mb-3" style="display: none;"></div>

    <!-- Results Count Bar -->
    <div class="d-flex align-items-center justify-content-between mb-2 px-1">
        <span class="fw-bold text-dark small"><i class="fa-solid fa-users me-1 text-danger"></i> قائمة الحضور</span>
        <span class="badge bg-dark rounded-pill px-3 py-2" id="totalCount">0 ضيف</span>
    </div>

    <!-- Guests Cards Container (Mobile Friendly) -->
    <div id="cardsContainer">
        <div class="text-center py-5">
            <div class="spinner-border text-danger mb-2" role="status"></div>
            <p class="text-muted small">جاري تحميل جدول الحضور...</p>
        </div>
    </div>
</div>

<script>
    let guestsData = [];
    let seatMap = {};

    // Auto-load Excel file with fallback
    window.addEventListener('DOMContentLoaded', () => {
        loadExcel('جدول الحضور-1.xlsx')
            .catch(() => loadExcel('جدول الحضور.xlsx'))
            .catch(err => {
                console.error(err);
                document.getElementById('cardsContainer').innerHTML = `
                    <div class="card p-4 text-center border-danger">
                        <i class="fa-solid fa-triangle-exclamation text-danger fs-1 mb-2"></i>
                        <h6 class="fw-bold text-danger">تعذر تحميل جدول البيانات</h6>
                        <p class="text-muted small mb-0">تأكد من وجود ملف <strong>'جدول الحضور.xlsx'</strong> داخل المستودع على GitHub.</p>
                    </div>`;
            });
    });

    function loadExcel(filename) {
        return fetch(filename)
            .then(res => {
                if (!res.ok) throw new Error('File not found: ' + filename);
                return res.arrayBuffer();
            })
            .then(buffer => {
                const workbook = XLSX.read(buffer, { type: 'array' });
                const sheetName = workbook.SheetNames[0];
                const sheet = workbook.Sheets[sheetName];
                const jsonData = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                processData(jsonData);
            });
    }

    function processData(rows) {
        guestsData = [];
        seatMap = {};
        let currentSection = "الصف الأول";

        for (let i = 0; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length === 0) continue;

            const col2 = row[2] ? String(row[2]).trim() : '';
            const col3 = row[3] ? String(row[3]).trim() : '';
            const col4 = row[4] ? String(row[4]).trim() : '';

            // Detect row section titles
            if (col2.includes('الصف') && !col3 && !col4) {
                currentSection = col2;
                continue;
            }

            if (col4 && !isNaN(col4) && col3 && col3 !== 'الاسم') {
                const seatNum = parseInt(col4);
                const guest = {
                    seat: seatNum,
                    section: currentSection,
                    name: col3,
                    title: col2
                };
                guestsData.push(guest);
                seatMap[seatNum] = guest;
            }
        }

        document.getElementById('totalCount').innerText = `${guestsData.length} ضيف`;
        renderCards(guestsData);
    }

    function renderCards(data) {
        const container = document.getElementById('cardsContainer');
        if (data.length === 0) {
            container.innerHTML = `
                <div class="card p-4 text-center text-muted my-3">
                    <i class="fa-solid fa-magnifying-glass fs-2 mb-2 text-secondary"></i>
                    <span>لا توجد نتائج مطابقة للبحث</span>
                </div>`;
            return;
        }

        container.innerHTML = data.map(item => `
            <div class="guest-card d-flex align-items-center gap-3">
                <div class="seat-number-box">
                    <span class="num">${item.seat}</span>
                    <span class="lbl">كرسي</span>
                </div>
                <div class="flex-grow-1 overflow-hidden">
                    <div class="d-flex align-items-center justify-content-between mb-1">
                        <span class="section-tag">${item.section}</span>
                    </div>
                    <div class="guest-name text-truncate">${item.name}</div>
                    <div class="guest-title text-truncate">${item.title || 'ضيف كريم'}</div>
                </div>
            </div>
        `).join('');
    }

    function searchData() {
        document.getElementById('seatInput').value = '';
        document.getElementById('seatStatusResult').style.display = 'none';

        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        if (!query) {
            renderCards(guestsData);
            return;
        }

        const filtered = guestsData.filter(g => 
            g.name.toLowerCase().includes(query) || 
            (g.title && g.title.toLowerCase().includes(query))
        );
        renderCards(filtered);
    }

    function checkSeat() {
        document.getElementById('searchInput').value = '';
        const seatNum = parseInt(document.getElementById('seatInput').value);
        const resultDiv = document.getElementById('seatStatusResult');

        if (isNaN(seatNum)) {
            resultDiv.style.display = 'none';
            renderCards(guestsData);
            return;
        }

        if (seatMap[seatNum]) {
            const guest = seatMap[seatNum];
            resultDiv.className = "status-box bg-danger text-white shadow-sm";
            resultDiv.innerHTML = `
                <div class="d-flex align-items-center gap-2 mb-2">
                    <i class="fa-solid fa-circle-xmark fs-3 text-warning"></i>
                    <h6 class="mb-0 fw-bold">الكرسي رقم (${seatNum}) : <span class="badge bg-warning text-dark">مشغــــول</span></h6>
                </div>
                <div class="bg-black bg-opacity-25 p-2 rounded-3 small">
                    <div><strong>الاسم:</strong> ${guest.name}</div>
                    <div><strong>الصفة:</strong> ${guest.title || '-'}</div>
                    <div><strong>الموقع:</strong> ${guest.section}</div>
                </div>
            `;
            renderCards([guest]);
        } else {
            resultDiv.className = "status-box bg-success text-white shadow-sm";
            resultDiv.innerHTML = `
                <div class="d-flex align-items-center gap-2">
                    <i class="fa-solid fa-circle-check fs-3"></i>
                    <div>
                        <h6 class="mb-0 fw-bold">الكرسي رقم (${seatNum}) : شــــاغر (فاضي)</h6>
                        <span class="small opacity-75">المقعد متاح ولا يوجد ضيف محجوز عليه.</span>
                    </div>
                </div>
            `;
            renderCards([]);
        }
        resultDiv.style.display = 'block';
    }

    function clearSearch(inputId) {
        document.getElementById(inputId).value = '';
        if (inputId === 'searchInput') searchData();
        if (inputId === 'seatInput') checkSeat();
    }
</script>

</body>
</html>
